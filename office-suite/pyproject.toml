[project]
name = "office-suite"
version = "0.1.0"
description = "Local dependencies for the office-suite skill (docx, xlsx, pptx, pdf)."
requires-python = ">=3.10"
dependencies = [
    # Shared OOXML tooling (scripts/office, scripts/word, scripts/pptx)
    "defusedxml>=0.7",
    "lxml>=4.9",
    "pillow>=10.0",
    # Word / DOCX
    "python-docx>=1.1",
    # Excel / XLSX
    "openpyxl>=3.1",
    "pandas>=2.0",
    # PDF
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
    "pypdfium2>=4.0",
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    "matplotlib>=3.7",
]

# System packages (not installable via uv): LibreOffice (soffice), Poppler
# (pdftoppm/pdftotext/pdfimages), qpdf, pandoc, tesseract-ocr. Install these
# with the OS package manager. Node tools (docx, pptxgenjs) install via npm.
